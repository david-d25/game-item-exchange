# Build once, deploy that exact build.
#
# The images are the artifact: they are built here, tagged with the commit they came from,
# pushed to GHCR, and k3s on the server only pulls them. See deploy/README.md.
#
# Rolling back is `kubectl -n gie rollout undo` on the server, or running this workflow on an older commit.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  jvm:
    name: Build and publish core and matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Runs the tests too: a commit that fails them never gets an image.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      # Jib builds the images without Docker and pushes them straight to the registry.
      - name: Push images
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :platform:core:jib :platform:matcher:jib --console=plain
          -PimageRepository="$IMAGE_PREFIX"
          -PimageTag="$GITHUB_SHA"
          -Djib.to.tags=latest
          -Djib.to.auth.username="$REGISTRY_USER"
          -Djib.to.auth.password="$REGISTRY_PASSWORD"

  web:
    name: Build and publish the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image build type-checks and builds the app (npm run build)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: platform/web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  bots:
    name: Build and publish the bots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/bots/package-lock.json

      - name: Test
        working-directory: clients/bots
        run: npm ci && npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: clients/bots
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/bots:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/bots:latest
          cache-from: type=gha,scope=bots
          cache-to: type=gha,scope=bots,mode=max

  deploy:
    name: Deploy
    needs: [jvm, web, bots]
    runs-on: ubuntu-latest
    # Build and publish only until a deploy host is configured
    if: ${{ vars.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authorise
        uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          host: ${{ vars.DEPLOY_HOST }}
          host-key: ${{ vars.DEPLOY_HOST_KEY }}
          user: ${{ vars.DEPLOY_USER }}

      # The overlay names every image with the tag `latest`; this deploy pins the commit it has just built,
      # so every deploy changes the pod specs and Kubernetes rolls them out.
      - name: Pin the images to this commit
        run: |
          sed -i "s/newTag: latest/newTag: $GITHUB_SHA/" deploy/k8s/overlays/prod/kustomization.yaml
          grep -c "newTag: $GITHUB_SHA" deploy/k8s/overlays/prod/kustomization.yaml

      # One connection for the whole deploy; the manifests travel through the same pipe as a tar stream
      # and replace the previous copy on the server. Secrets are not in them: they live in the cluster.
      - name: Apply and wait for the rollout
        env:
          DIR: ${{ vars.DEPLOY_PATH }}
        run: |
          tar -C deploy/k8s -czf - . | ssh deploy-target "
            set -eu
            rm -rf '$DIR/k8s.new'
            mkdir -p '$DIR/k8s.new'
            tar -C '$DIR/k8s.new' -xzf -
            rm -rf '$DIR/k8s'
            mv '$DIR/k8s.new' '$DIR/k8s'
            kubectl apply -k '$DIR/k8s/overlays/prod'
            for workload in statefulset/postgres statefulset/kafka deployment/core-api deployment/matcher deployment/web deployment/bots; do
              kubectl -n gie rollout status \$workload --timeout=300s
            done
          "
