# Local infrastructure for running services from the IDE.
#   Start:            docker compose -f docker-compose.dev.yml up -d
#   Stop, keep data:  docker compose -f docker-compose.dev.yml stop
#   Reset all data:   docker compose -f docker-compose.dev.yml down -v
# Postgres and Kafka share one lifecycle, so their data never goes out of sync.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    ports:
      - "5432:5432"

  kafka:
    # Native (GraalVM) build of the broker: starts in about a second and needs far less memory.
    # Intended for development and tests only.
    image: apache/kafka-native:4.3.1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL is for other containers, HOST is for services started from the IDE
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly below, never implicitly because of a typo in a topic name
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  # One-off job: waits for the broker, creates topics and exits.
  # Uses the regular image because the native one has no CLI tools.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list > /dev/null 2>&1; do
          sleep 1
        done
        for topic in orders match-results market-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$topic" --partitions 12 --replication-factor 1 --config retention.ms=-1
        done
        echo "Topics are ready"
