spring:
  application:
    name: core
  threads:
    virtual:
      enabled: true  # requests run on virtual threads: no 1 MB stack per request thread
  mvc:
    problemdetails:
      enabled: true
  kafka:
    consumer:
      auto-offset-reset: earliest  # a new consumer group starts from the first message, not from "now"
giexchange:
  relay:
    enabled: false
  topics:
    create: false  # Kubernetes has the Strimzi topic operator; the Compose production turns this on
  fees:
    trade-bps: 500  # 5%, paid by the seller
  auth:
    secret: ""  # HMAC key for user tokens, at least 32 bytes; core does not start without one
  internal:
    token: ""  # shared secret of the internal API for bots; empty turns the internal API off
  notifications:
    keep: 7d
  guest:
    max-per-hour: 300
    token-ttl: 30d
    starter-credits: 50000
    starter-items:
      - market-key: idle-mine/iron_ore
        quantity: 20
      - market-key: idle-mine/coal
        quantity: 50
      - market-key: idle-mine/crystal
        quantity: 2
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true  # /actuator/health/liveness and /readiness, also outside Kubernetes

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/core
    username: core
    password: core
  kafka:
    bootstrap-servers: localhost:9092
  flyway:
    locations: classpath:db/migration,classpath:db/dev
giexchange:
  relay:
    enabled: true
  auth:
    secret: dev-only-token-secret-do-not-use-in-production
  internal:
    token: dev-internal-token
