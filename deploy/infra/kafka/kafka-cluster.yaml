# A group of Kafka nodes with the same settings. One node that is both the broker and the KRaft controller:
# enough for development; production would use three.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: exchange
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 2Gi
    deleteClaim: false
  # The broker keeps message data in the OS page cache, not in the heap:
  # a small heap plus some free memory in the container works better than a big heap.
  jvmOptions:
    "-Xms": 384m
    "-Xmx": 384m
  resources:
    requests:
      memory: 768Mi
      cpu: 200m
    limits:
      memory: 768Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: exchange
spec:
  kafka:
    # No version set: the operator uses its default, so this file does not have to change with every Strimzi upgrade
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # One broker, so every internal topic can have only one copy
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Topics are created only from KafkaTopic resources, never by a typo in a topic name
      auto.create.topics.enable: false
  # Turns KafkaTopic resources into real topics
  entityOperator:
    topicOperator: {}
  # Consumer lag and partition offsets for Prometheus
  kafkaExporter: {}
