apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gie
resources:
  - ../../base
  # Need Traefik and the Prometheus operator, which only the local cluster has
  - ingress.yaml
  - podmonitors.yaml
secretGenerator:
  - name: postgres
    literals:
      - username=core
      - password=core-local-only
  - name: core-secrets
    literals:
      - auth-secret=local-only-token-secret-not-for-production
      - internal-token=local-only-internal-token
configMapGenerator:
  - name: core-config
    literals:
      # The dev profile adds the dev seed with Alice and Bob and the X-Dev-User-Id header for debugging
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/core
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=exchange-kafka-bootstrap.kafka.svc:9092
  - name: matcher-config
    literals:
      - KAFKA_BOOTSTRAP_SERVERS=exchange-kafka-bootstrap.kafka.svc:9092
  - name: bots-config
    literals:
      - BOT_MAKERS=2
      - BOT_TAKERS=3
      - BOT_ORDERS_PER_SECOND=2
