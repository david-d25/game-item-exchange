# A single Kafka broker without Strimzi: the operator, its topic operator and a JVM broker would need
# about a gigabyte on their own, more than the whole exchange. The native (GraalVM) build of the broker
# starts in a second and runs on a fraction of the memory. Upstream calls that image experimental;
# the data it writes is standard Kafka.
#
# Topics are created by core at startup (GIEXCHANGE_TOPICS_CREATE), with the same settings as the
# KafkaTopic resources of the local cluster. Automatic creation is off, so a client that comes first
# can never create `orders` with the wrong number of partitions.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Kubernetes would add KAFKA_PORT, KAFKA_SERVICE_HOST and so on for the Service above,
      # and the image turns every KAFKA_* variable into a broker setting
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka-native:4.3.1
          ports:
            - name: kafka
              containerPort: 9092
          env:
            # Written into the data directory on the first start and checked on every later one.
            # Fixed here, so a new image with a different default can never refuse the existing data.
            - name: CLUSTER_ID
              value: yUi1fIpQRDu9wLlyCwFRRA
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # One broker, so every internal topic can have only one copy
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OPTS
              value: -Xmx192m
          resources:
            requests:
              memory: 192Mi
              cpu: 50m
            limits:
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  # The matcher rebuilds its order books from `orders` at every start, so this disk and the
  # Postgres disk hold one state together: keep both or reset both.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
