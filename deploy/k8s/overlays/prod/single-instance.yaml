# One process of each kind. Locally core runs as two API replicas plus a separate relay, and two
# matchers split the partitions; on a small shared server one core process does all three jobs
# and one matcher owns all 12 partitions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: core
          env:
            # During a rolling update two core pods overlap for a few seconds; the relay takes
            # a Postgres advisory lock for every batch, so only one of them publishes at a time
            - name: GIEXCHANGE_RELAY_ENABLED
              value: "true"
          resources:
            requests:
              memory: 320Mi
              cpu: 50m
            limits:
              memory: 448Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-relay
$patch: delete
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: matcher
          resources:
            requests:
              memory: 160Mi
              cpu: 50m
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              memory: 384Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
