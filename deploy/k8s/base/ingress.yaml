# Entrance from outside the cluster: everything goes to the gateway (the web image), as in production.
# The gateway forwards only /exchange/api/ to core, so /actuator and /internal stay reachable
# inside the cluster but not from outside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
