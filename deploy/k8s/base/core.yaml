# core in API mode: HTTP API and settlement. Replicas share the HTTP load,
# and Kafka splits the match-results partitions between their settlement consumers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      containers:
        - name: core
          image: game-item-exchange/core:dev
          ports:
            - name: http
              containerPort: 8080
          # Settings that differ between environments come from a ConfigMap made by the overlay
          envFrom:
            - configMapRef:
                name: core-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: GIEXCHANGE_RELAY_ENABLED
              value: "false"
            - name: GIEXCHANGE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: auth-secret
            - name: GIEXCHANGE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: internal-token
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 512Mi
          # Gives the JVM up to two minutes to start before the other probes begin
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          # Failing: the process is stuck, restart the container
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          # Failing: alive but not able to serve right now, stop sending it requests
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
spec:
  selector:
    app: core-api
  ports:
    - port: 80
      targetPort: 8080
---
# The same image in relay mode. Exactly one instance, otherwise messages of one market may be reordered.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-relay
spec:
  replicas: 1
  # The default strategy starts the new pod before stopping the old one, so for a few seconds
  # there would be two relays. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: core-relay
  template:
    metadata:
      labels:
        app: core-relay
    spec:
      containers:
        - name: core
          image: game-item-exchange/core:dev
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: core-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: GIEXCHANGE_RELAY_ENABLED
              value: "true"
            - name: GIEXCHANGE_SETTLEMENT_ENABLED
              value: "false"
            - name: GIEXCHANGE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: core-secrets
                  key: auth-secret
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
